name: Build desktop
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-amd64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/download-core.py --platform ${{ matrix.platform }}
      - run: cargo test -p smart-vpn-engine --locked
        env:
          SMARTVPN_TEST_CORE: ${{ format('{0}/core/sing-box{1}', github.workspace, runner.os == 'Windows' && '.exe' || '') }}
      - uses: actions/setup-go@v5
        if: runner.os == 'macOS'
        with:
          go-version: '1.25.5'
      - name: Build restricted TUN core and helper
        if: runner.os == 'macOS'
        run: |
          python scripts/build-network-core.py --work-dir "$RUNNER_TEMP/foxvpn-core"
          cargo build --release --locked -p smart-vpn-engine --bin foxvpn-helper
          cp target/release/foxvpn-helper core/foxvpn-helper
          codesign --force --sign - --options runtime --identifier ru.smartvpn.network-helper core/foxvpn-helper
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npm run tauri -- build --config src-tauri/tauri.macos.conf.json --bundles app
        if: runner.os == 'macOS'
        working-directory: apps/desktop
      - run: npm run tauri -- build
        if: runner.os == 'Windows'
        working-directory: apps/desktop
      - name: Seal and archive macOS app
        if: runner.os == 'macOS'
        run: |
          python scripts/seal-macos-bundle.py "target/release/bundle/macos/foxVPN.app"
          ditto -c -k --keepParent --norsrc --noextattr "target/release/bundle/macos/foxVPN.app" "foxVPN-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: foxVPN-${{ matrix.platform }}-unsigned
          path: |
            foxVPN-*.zip
            target/release/bundle/nsis/*.exe
