name: Build desktop
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-amd64
          - os: windows-latest
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/download-core.py --platform ${{ matrix.platform }}
      - run: cargo test -p smart-vpn-engine --locked
        env:
          SMARTVPN_TEST_CORE: ${{ github.workspace }}/core/sing-box
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npm run tauri -- build
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: foxVPN-${{ matrix.platform }}-unsigned
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
