[workspace]
members = [".", "apps/desktop/src-tauri"]
default-members = ["."]
resolver = "2"

[package]
name = "smart-vpn-engine"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
percent-encoding = "2"
base64 = "0.22"
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "blocking", "json"] }
libc = "0.2"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
